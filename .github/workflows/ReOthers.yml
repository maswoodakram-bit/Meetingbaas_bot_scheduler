name: Test Recall Bots

on:
  workflow_dispatch:

jobs:
  create-bots:
    runs-on: ubuntu-latest

    steps:
      - name: Create Meeting Bots
        env:
          RECALLAI_API_KEY: ${{ secrets.RECALLAI_API_KEY }}
          MEETING_URL: ${{ secrets.TEST_URL }}

        run: |
          set -euo pipefail

          echo "Checking configuration..."

          if [[ -z "$RECALLAI_API_KEY" ]]; then
            echo "ERROR: RECALLAI_API_KEY is missing."
            exit 1
          fi

          if [[ -z "$MEETING_URL" ]]; then
            echo "ERROR: TEST_URL is missing or empty."
            exit 1
          fi

          echo "Both secrets are present."

          BOT_NAMES=(
            "22 Shahul"
            "23 Haseeb"
          )

          for BOT_NAME in "${BOT_NAMES[@]}"; do
            echo "Creating bot: $BOT_NAME"

            jq -n \
              --arg meeting_url "$MEETING_URL" \
              --arg bot_name "$BOT_NAME" \
              '{
                meeting_url: $meeting_url,
                bot_name: $bot_name,
                recording_config: null,
                automatic_leave: {
                  waiting_room_timeout: 1800,
                  noone_joined_timeout: 1800,
                  in_call_not_recording_timeout: 14400
                }
              }' > request.json

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --output response.json \
              --write-out "%{http_code}" \
              --request POST \
              "https://us-west-2.recall.ai/api/v1/bot/" \
              --header "Authorization: Token $RECALLAI_API_KEY" \
              --header "Content-Type: application/json" \
              --header "Accept: application/json" \
              --data @request.json) || {
                echo "ERROR: The HTTP request failed."
                exit 1
              }

            echo "HTTP status: $HTTP_CODE"
            echo "API response:"

            jq . response.json 2>/dev/null || cat response.json

            if [[ "$HTTP_CODE" != "201" ]]; then
              echo "ERROR: Recall.ai did not return HTTP 201."
              exit 1
            fi

            echo "Bot creation succeeded: $BOT_NAME"
          done
